services:
  # 1. FastAPI REST Backend Engine
  - type: web
    name: niticlaim-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./insurance_claims.db
      - key: DEFAULT_LLM_PROVIDER
        value: perplexity
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # 2. Streamlit Claims Adjudicator Portal
  - type: web
    name: niticlaim-streamlit
    runtime: docker
    dockerfilePath: ./Dockerfile.streamlit
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./insurance_claims.db
      - key: DEFAULT_LLM_PROVIDER
        value: perplexity
      - key: PERPLEXITY_API_KEY
        sync: false

  # 3. Modern React 19 Frontend Workbench
  - type: web
    name: niticlaim-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
